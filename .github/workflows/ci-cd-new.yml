name: "Deploy to EC2"

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: student-images
  ECR_REGISTRY: 986552986813.dkr.ecr.us-east-1.amazonaws.com
  EC2_TAG_NAME: student-service-ec2
  APP_PORT: 8089

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v3

      # ─── 2. Build ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      # ─── 3. AWS Auth ────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ─── 4. Build & Push Docker image ───────────────────────────────────────
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="v${{ github.run_number }}-${SHORT_SHA}"
          docker build -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "✅ Pushed: ${IMAGE_TAG}"

      # ─── 5. Find or create EC2 ────────────────────────────────────────────────
      - name: Get or create EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
              "Name=instance-state-name,Values=running,stopped,pending" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text --region ${{ env.AWS_REGION }})

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "⚠️ No EC2 found with tag Name=${{ env.EC2_TAG_NAME }}"
            echo "🔨 Creating new EC2 instance (t2.micro — free tier)..."

            # Get latest Amazon Linux 2023 AMI
            AMI_ID=$(aws ec2 describe-images \
              --owners amazon \
              --filters \
                "Name=name,Values=al2023-ami-2023.*-x86_64" \
                "Name=state,Values=available" \
              --query "Images | sort_by(@, &CreationDate) | [-1].ImageId" \
              --output text --region ${{ env.AWS_REGION }})
            echo "   AMI: $AMI_ID"

            # Get default VPC and first subnet
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=isDefault,Values=true" \
              --query "Vpcs[0].VpcId" \
              --output text --region ${{ env.AWS_REGION }})

            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query "Subnets[0].SubnetId" \
              --output text --region ${{ env.AWS_REGION }})

            # Create or reuse security group
            SG_ID=$(aws ec2 describe-security-groups \
              --filters \
                "Name=group-name,Values=student-service-sg" \
                "Name=vpc-id,Values=$VPC_ID" \
              --query "SecurityGroups[0].GroupId" \
              --output text --region ${{ env.AWS_REGION }})

            if [ "$SG_ID" == "None" ] || [ -z "$SG_ID" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name student-service-sg \
                --description "SG for student-service EC2" \
                --vpc-id $VPC_ID \
                --query "GroupId" \
                --output text --region ${{ env.AWS_REGION }})

              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol tcp --port ${{ env.APP_PORT }} --cidr 0.0.0.0/0 \
                --region ${{ env.AWS_REGION }}

              aws ec2 authorize-security-group-ingress \
                --group-id $SG_ID \
                --protocol tcp --port 443 --cidr 0.0.0.0/0 \
                --region ${{ env.AWS_REGION }}

              echo "   Created SG: $SG_ID"
            else
              echo "   Reusing SG: $SG_ID"
            fi

            # Launch t2.micro instance (free tier eligible)
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id $AMI_ID \
              --instance-type t2.micro \
              --subnet-id $SUBNET_ID \
              --security-group-ids $SG_ID \
              --iam-instance-profile Name=ec2-s3-role \
              --associate-public-ip-address \
              --user-data '#!/bin/bash
          yum update -y
          yum install -y docker
          systemctl enable docker && systemctl start docker' \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.EC2_TAG_NAME }}}]" \
              --query "Instances[0].InstanceId" \
              --output text --region ${{ env.AWS_REGION }})

            echo "   Instance: $INSTANCE_ID"
            echo "⏳ Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region ${{ env.AWS_REGION }}
            aws ec2 wait instance-status-ok --instance-ids $INSTANCE_ID --region ${{ env.AWS_REGION }}
            echo "✅ EC2 created: $INSTANCE_ID"
          fi

          # Start if stopped
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text --region ${{ env.AWS_REGION }})
          if [ "$STATE" == "stopped" ]; then
            echo "⚠️ Instance stopped — starting..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID --region ${{ env.AWS_REGION }}
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID --region ${{ env.AWS_REGION }}
            sleep 20
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text --region ${{ env.AWS_REGION }})

          AZ=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].Placement.AvailabilityZone" \
            --output text --region ${{ env.AWS_REGION }})

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP"      >> $GITHUB_OUTPUT
          echo "az=$AZ"                    >> $GITHUB_OUTPUT
          echo "✅ EC2: $INSTANCE_ID | IP: $PUBLIC_IP | AZ: $AZ"

      # ─── 6. Deploy via SSM (no SSH / no port 22 needed) ────────────────────
      - name: Deploy to EC2 via SSM
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"

          # Build the deploy script as a JSON file to avoid shell escaping issues
          cat > /tmp/ssm-command.json << EOF
          {
            "InstanceIds": ["$INSTANCE_ID"],
            "DocumentName": "AWS-RunShellScript",
            "Parameters": {
              "commands": [
                "yum install -y docker 2>/dev/null || apt-get install -y docker.io 2>/dev/null || true",
                "systemctl start docker || service docker start || true",
                "systemctl enable docker || true",
                "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}",
                "docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",
                "docker stop student-service 2>/dev/null || true",
                "docker rm student-service 2>/dev/null || true",
                "docker run -d --name student-service --restart unless-stopped -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} -e SPRING_PROFILES_ACTIVE=dev ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}",
                "docker ps --filter name=student-service --format 'Running: {{.Names}} {{.Status}}'"
              ]
            }
          }
          EOF

          echo "🚀 Sending deploy command via SSM..."
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-command.json \
            --region ${{ env.AWS_REGION }} \
            --query "Command.CommandId" \
            --output text)

          echo "📋 Command ID: $COMMAND_ID"
          echo "⏳ Waiting for deployment to complete..."

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --region ${{ env.AWS_REGION }} \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "  [$i/30] Status: $STATUS"

            if [ "$STATUS" == "Success" ]; then
              echo "✅ Deployment successful!"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --region ${{ env.AWS_REGION }} \
                --query "StandardOutputContent" --output text
              break
            elif [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ] || [ "$STATUS" == "Cancelled" ]; then
              echo "❌ Deployment failed: $STATUS"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --region ${{ env.AWS_REGION }} \
                --query "StandardErrorContent" --output text
              exit 1
            fi

            sleep 10
            [ $i -eq 30 ] && echo "❌ Timed out waiting for SSM command" && exit 1
          done