name: "Deploy to EC2"

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: student-images
  ECR_REGISTRY: 986552986813.dkr.ecr.us-east-1.amazonaws.com
  EC2_TAG_NAME: student-service-ec2
  APP_PORT: 8089

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v3

      # ─── 2. Build ───────────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean install -DskipTests

      # ─── 3. AWS Auth ────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      # ─── 4. Build & Push Docker image ───────────────────────────────────────
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="v${{ github.run_number }}-${SHORT_SHA}"
          docker build -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "✅ Pushed: ${IMAGE_TAG}"

      # ─── 5. Find existing EC2 ───────────────────────────────────────────────
      - name: Get EC2 instance info
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=${{ env.EC2_TAG_NAME }}" \
              "Name=instance-state-name,Values=running,stopped,pending" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text --region ${{ env.AWS_REGION }})

          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "❌ No EC2 found with tag Name=${{ env.EC2_TAG_NAME }}"
            echo "   Make sure your EC2 instance has a tag: Name = student-service-ec2"
            exit 1
          fi

          # Start if stopped
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].State.Name" \
            --output text)
          if [ "$STATE" == "stopped" ]; then
            echo "⚠️ Instance stopped — starting..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID
            sleep 20
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          AZ=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query "Reservations[0].Instances[0].Placement.AvailabilityZone" \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP"      >> $GITHUB_OUTPUT
          echo "az=$AZ"                    >> $GITHUB_OUTPUT
          echo "✅ EC2: $INSTANCE_ID | IP: $PUBLIC_IP | AZ: $AZ"

      # ─── 6. Deploy via EC2 Instance Connect ─────────────────────────────────
      - name: Deploy to EC2
        run: |
          INSTANCE_ID="${{ steps.ec2.outputs.instance_id }}"
          PUBLIC_IP="${{ steps.ec2.outputs.public_ip }}"
          AZ="${{ steps.ec2.outputs.az }}"

          echo "⏳ Waiting for SSH to be available..."
          for i in $(seq 1 20); do
            # Generate temp key and push via EC2 Instance Connect
            ssh-keygen -t rsa -b 2048 -f /tmp/tmp_key -N "" -q
            aws ec2-instance-connect send-ssh-public-key \
              --instance-id $INSTANCE_ID \
              --instance-os-user ec2-user \
              --ssh-public-key file:///tmp/tmp_key.pub \
              --availability-zone $AZ 2>/dev/null || true

            if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 \
              -i /tmp/tmp_key ec2-user@$PUBLIC_IP "echo OK" 2>/dev/null; then
              echo "✅ SSH ready (attempt $i)"
              break
            fi
            rm -f /tmp/tmp_key /tmp/tmp_key.pub
            echo "Attempt $i/20 — retrying in 10s..."
            sleep 10
            [ $i -eq 20 ] && echo "❌ SSH unavailable" && exit 1
          done

          # Fresh key for deployment session
          ssh-keygen -t rsa -b 2048 -f /tmp/deploy_key -N "" -q
          aws ec2-instance-connect send-ssh-public-key \
            --instance-id $INSTANCE_ID \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/deploy_key.pub \
            --availability-zone $AZ

          echo "🚀 Deploying image: ${{ env.IMAGE_TAG }}"

          ssh -o StrictHostKeyChecking=no -i /tmp/deploy_key ec2-user@$PUBLIC_IP << ENDSSH
          set -e
          echo "🔐 ECR login..."
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

          echo "📦 Pulling ${{ env.IMAGE_TAG }}..."
          docker pull ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          echo "🛑 Stopping old container..."
          docker stop student-service 2>/dev/null || true
          docker rm   student-service 2>/dev/null || true

          echo "▶️ Starting container..."
          docker run -d \
            --name student-service \
            --restart unless-stopped \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            -e SPRING_PROFILES_ACTIVE=dev \
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

          docker ps --filter name=student-service --format "✅ Running: {{.Names}} {{.Status}}"
          ENDSSH

      # ─── 7. Smoke Test ───────────────────────────────────────────────────────
      - name: Smoke test APIs
        run: |
          BASE="http://${{ steps.ec2.outputs.public_ip }}:${{ env.APP_PORT }}"
          echo "⏳ Waiting 40s for Spring Boot to start..."
          sleep 40

          # Wait until app responds
          for i in $(seq 1 15); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$BASE/students/school" || echo "000")
            [ "$CODE" != "000" ] && echo "✅ App is up" && break
            echo "Attempt $i — not ready yet, waiting 10s..."
            sleep 10
            [ $i -eq 15 ] && echo "❌ App failed to start" && exit 1
          done

          pass=0; fail=0

          run_test() {
            local name=$1 method=$2 url=$3 body=$4 expected=$5
            if [ -n "$body" ]; then
              CODE=$(curl -s -o /tmp/resp -w "%{http_code}" --max-time 10 -X $method "$url" \
                -H "Content-Type: application/json" -d "$body")
            else
              CODE=$(curl -s -o /tmp/resp -w "%{http_code}" --max-time 10 "$url")
            fi
            BODY=$(cat /tmp/resp)
            if [ "$CODE" == "$expected" ] || ([ "$expected" == "200/201" ] && ([ "$CODE" == "200" ] || [ "$CODE" == "201" ])); then
              echo "✅ $name → $CODE"
              pass=$((pass+1))
            else
              echo "❌ $name → $CODE (expected $expected) | $BODY"
              fail=$((fail+1))
            fi
          }

          echo ""
          echo "══════════════════════ SMOKE TESTS ══════════════════════"
          run_test "GET /students"         GET  "$BASE/students"         "" "200"
          run_test "GET /students/school"  GET  "$BASE/students/school"  "" "200"
          run_test "POST /students"        POST "$BASE/students" '{"name":"ci-test","grade":"A"}' "200/201"
          echo "══════════════════════════════════════════════════════════"
          echo "Results: ✅ $pass passed  ❌ $fail failed"
          echo ""
          echo "🔗 App URL : $BASE"
          echo "🔗 Students: $BASE/students"
          [ $fail -gt 0 ] && exit 1 || exit 0
